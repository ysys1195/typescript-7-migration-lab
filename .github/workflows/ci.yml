name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux / Node 20
            os: ubuntu-latest
            node: 20
          - label: Linux / Node 22
            os: ubuntu-latest
            node: 22
          - label: Linux / Node 24
            os: ubuntu-latest
            node: 24
          - label: macOS / Node 24
            os: macos-latest
            node: 24
          - label: Windows / Node 24
            os: windows-latest
            node: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Generate fixture smoke inputs
        run: npm run fixtures:generate
        env:
          LAB_FIXTURE_PRESET: small

      - name: Run unit and schema tests
        run: npm test

      - name: Verify fixture, diagnostics, and emit compatibility
        run: npm run ci:compatibility

      - name: Assert tracked files are unchanged
        run: git diff --exit-code
